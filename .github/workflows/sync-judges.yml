name: Weekly Judge Sync

# DISABLED: Data files (fci-full-raw.json, akc-full-raw.json) are too large
# for git (~200MB) and are gitignored. Scraping and syncing happen locally.
#
# TODO: Replace with a Cloud Function or scheduled Cloud Run job that reads
# directly from FCI/AKC and writes to Firestore — no local files needed.
#
# Manual workflow_dispatch kept for future use once data pipeline is redesigned.

on:
  workflow_dispatch:   # Manual trigger only — no automatic schedule

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json

      - name: Notice — data files required
        run: |
          echo "⚠️  sync-judges.js and sync-akc.js require fci-full-raw.json"
          echo "   and akc-full-raw.json which are gitignored (too large for git)."
          echo "   Upload them as artifacts or run sync locally."
          echo "   This workflow is a placeholder until the data pipeline is redesigned."

      - name: Clean up credentials
        if: always()
        run: rm -f serviceAccount.json
